spring.application.name=listening-together
server.port=8080

# Track uploads: max 50 MB (docs/protocol.md §2)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# Behind Caddy: take the client IP from X-Forwarded-For. Tomcat only trusts that header from local/private
# addresses, so clients can't spoof it to dodge the per-IP rate limits.
server.forward-headers-strategy=native
